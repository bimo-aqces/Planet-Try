<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Bimo</title>

    <style>
        body {
            background-color: aquamarine;
            color: black;
            margin: 0;
        }

        canvas{
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="myCanvas"></canvas>
    
    <script>
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener("resize", () => {location.reload()});

        let sx = canvas.width / 2;
        let sy = canvas.height / 2;

        let px; 
        let py;

        let v_px; 
        let v_py;

        const s_gravity = 1000;

        const planets = [];

        canvas.addEventListener("click", e =>{
            const click_px = e.clientX;
            const click_py = e.clientY;

            const distance_px = sx-px;
            const distance_py = sy-py;
            const distance = Math.sqrt(Math.pow(distance_px,2)+Math.pow(distance_py,2));

            planets.push({
                px: click_px,
                py: click_py,
                v_px: 0,
                v_py: 2,
                radius: 16,
                color: "#62D58E"
            });
        })

        function doAnimate(){
            ctx.clearRect(0,0,canvas.width, canvas.height);
            
            planets.forEach(p=>{
                let distance_px = sx - p.px;
                let distance_py = sy - p.py;
                let distance = Math.sqrt(Math.pow(distance_px, 2) + Math.pow(distance_py, 2));

                if (distance > 10) {
                    let force = s_gravity / Math.pow(distance, 2);
                    let a_px = (distance_px / distance) * force;
                    let a_py = (distance_py / distance) * force;

                    p.v_px += a_px;
                    p.v_py += a_py;
                }

                p.px += p.v_px;
                p.py += p.v_py;

                ctx.beginPath();
                ctx.arc(p.px, p.py, 20, 0, Math.PI * 2);
                ctx.fillStyle = "#CED562";
                ctx.fill();
            })

            ctx.beginPath();
            ctx.arc(sx, sy, 50, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.fill();

            requestAnimationFrame(doAnimate);
        }

        doAnimate();

    </script>
</body>
</html>
